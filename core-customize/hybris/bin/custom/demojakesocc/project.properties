# you can put key/value pairs here.
# Use Config.getParameter(..) to retrieve the values during runtime.

# Specifies the location of the spring context file putted automatically to the global platform application context.
demojakesocc.application-context=demojakesocc-spring.xml

demojakesocc.api.title=demojakesocc API
demojakesocc.api.description=demojakesocc Documentation
demojakesocc.api.version=1.0.0
demojakesocc.api.license=Use of this file is subject to the terms of your agreement with SAP SE or its affiliates respecting the use of the SAP product for which this file relates.
demojakesocc.api.license.url=
demojakesocc.api.oauth.tokenUrl=/authorizationserver/oauth/token
demojakesocc.api.oauth.password.scope=basic
demojakesocc.api.oauth.clientCredentials.scope=extended

demojakesocc.sap.apiType=REST
demojakesocc.sap.shortText=demojakesocc
demojakesocc.sap.state=Active
demojakesocc.sap.servers=default
demojakesocc.sap.server.default.url=https://{url}/demojakesocc
demojakesocc.sap.server.default.description=demojakesocc REST API endpoint
demojakesocc.sap.server.default.templates.url.description=SAP Commerce Cloud server URL where the application is deployed.

#enables static documentation generation by wsStaticDoc ant task
demojakesocc.documentation.static.generate=true


#Disabling tld and pluggability scans can greatly improve system startup time.
#demojakesocc.tomcat.tld.scan=*jstl-1*.jar
#demojakesocc.tomcat.tld.default.scan.enabled=false
#demojakesocc.tomcat.pluggability.scan=*jstl-1*.jar
#demojakesocc.tomcat.pluggability.default.scan.enabled=false

# Used to specify the list of API endpoint identifiers that must be disabled (example: getSample,createSample,getUsers)
# The endpoint identifier is represented by the "nickname" attribute of the ApiOperation annotation used on an endpoint method
#demojakesocc.api.restrictions.disabled.endpoints=
