# you can put key/value pairs here.
# Use Config.getParameter(..) to retrieve the values during runtime.

# Specifies the location of the spring context file putted automatically to the global platform application context.
jakeocc.application-context=jakeocc-spring.xml

jakeocc.api.title=jakeocc API
jakeocc.api.description=jakeocc Documentation
jakeocc.api.version=1.0.0
jakeocc.api.license=Use of this file is subject to the terms of your agreement with SAP SE or its affiliates respecting the use of the SAP product for which this file relates.
jakeocc.api.license.url=
jakeocc.api.oauth.tokenUrl=/authorizationserver/oauth/token
jakeocc.api.oauth.password.scope=basic
jakeocc.api.oauth.clientCredentials.scope=extended

jakeocc.sap.apiType=REST
jakeocc.sap.shortText=jakeocc
jakeocc.sap.state=Active
jakeocc.sap.servers=default
jakeocc.sap.server.default.url=https://{url}/jakeocc
jakeocc.sap.server.default.description=jakeocc REST API endpoint
jakeocc.sap.server.default.templates.url.description=SAP Commerce Cloud server URL where the application is deployed.

#enables static documentation generation by wsStaticDoc ant task
jakeocc.documentation.static.generate=true


#Disabling tld and pluggability scans can greatly improve system startup time.
#jakeocc.tomcat.tld.scan=*jstl-1*.jar
#jakeocc.tomcat.tld.default.scan.enabled=false
#jakeocc.tomcat.pluggability.scan=*jstl-1*.jar
#jakeocc.tomcat.pluggability.default.scan.enabled=false

